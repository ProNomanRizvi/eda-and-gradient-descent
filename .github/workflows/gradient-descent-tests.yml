name: Gradient descent tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: gradient-descent-from-scratch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: gradient-descent-from-scratch/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
